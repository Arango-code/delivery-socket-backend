services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery_socket
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_socket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  delivery_postgres_data:
